# Updates the generated parts of the site from the team's Google Sheets: program, camp and troop
# cards, the notice bar on every page, the counters on the home and Rólunk pages, the equipment
# page, the leader cards (with photos), the finance page and the gallery; and sends the reminder
# e-mails to the program organisers and the media person (tools/send_reminders.py) and, in autumn,
# about the new troop's leaders (tools/troop_reminder.py).
# Runs hourly and can be started by hand (Actions tab -> "Oldal frissítése a táblázatból" -> Run workflow).
# The test e-mails have their own workflow (test-emails.yml).
# If a sheet is broken or unreachable, that step fails and the page keeps its last good state.
# Once a month a tiny "keepalive" change is committed, because GitHub disables scheduled
# workflows after 60 days without activity.
# Step names and commit messages stay in Hungarian: the site's editors read them.
name: Oldal frissítése a táblázatból

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # a hung download must not block the hourly runs (a normal run takes 1–3 minutes)
    timeout-minutes: 20
    env:
      # Dates (expired notices, closed forms, the September 1 troop step-up) are evaluated in
      # Hungarian time, not in the runner's UTC
      TZ: Europe/Budapest
      # The shared workbook (every sheet of the site; edited by the Ginzeng and the media person),
      # published as a whole in Excel (.xlsx) format.
      TEAM_SHEET_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRmUbSRypUONm5iMrqiFU_ZqhMEEZAGu9cH-N5VEaYZOdePgTvD-3fjhac2w6qKi0yGXdN6Y8rLuaKa/pub?output=xlsx
      # Public ids of the Drive folders (not secrets; only the API key is): the portraits
      # ("Csapatvezetés") and the programs' images ("Program képek", one subfolder per program)
      DRIVE_LEADERS_FOLDER_ID: 1PYPnEW8ylJvzcRYkRAQSscebslm3nPrq
      DRIVE_PROGRAMS_FOLDER_ID: 1A-ZlCVWMnECNaOmWOXhiDhBNkEvabRNA
      # every warning / error of the steps is collected here, the "Hibák jelentése" step e-mails them
      SYNC_ISSUES_FILE: /tmp/sync_issues.jsonl
      # each workbook is downloaded once per run and shared by the steps
      SHEETS_CACHE_DIR: /tmp/sheets
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved, a SHA cannot): supply-chain safety.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405   # v6.2.0
        with:
          python-version: '3.12'
          # the downloaded packages are kept between runs (faster install; refreshed when the file changes)
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # For processing the images from Drive (portraits, program images: WebP, iPhone HEIC) and the
      # xlsx workbooks; exact versions in tools/requirements.txt
      - name: Képkezelő csomagok telepítése
        id: install
        run: pip install --quiet --disable-pip-version-check -r tools/requirements.txt

      - name: Programok (kártyák + képek a Drive-ról) frissítése
        id: programs
        if: ${{ !cancelled() }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: python tools/sync_programs.py

      # The following steps run even if an earlier one failed (one broken sheet must not block the
      # others); the run is still shown as failed on GitHub.
      - name: Táborok letöltése és az oldal frissítése
        id: camps
        if: ${{ !cancelled() }}
        run: python tools/sync_camps.py

      - name: Rajok letöltése és az oldal frissítése
        id: troops
        if: ${{ !cancelled() }}
        run: python tools/sync_troops.py

      - name: Értesítők letöltése és az oldalak frissítése
        id: notices
        if: ${{ !cancelled() }}
        run: python tools/sync_notices.py

      - name: Számlálók letöltése és az oldalak frissítése
        id: counters
        if: ${{ !cancelled() }}
        run: python tools/sync_counters.py

      - name: Csapatvezetés (kártyák + fotók a Drive-ról) frissítése
        id: leaders
        if: ${{ !cancelled() }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: python tools/sync_leaders.py

      - name: Eszközök letöltése és az oldal frissítése
        id: equipment
        if: ${{ !cancelled() }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: python tools/sync_equipment.py

      # Finance page: one workbook (sheets: Leírás, Tagdíj, Nagytábordíj, Kcs tábordíj), the WHOLE
      # document published in Excel (.xlsx) format. With an empty URL the page stays unchanged.
      - name: Pénzügyek (tagdíj, tábordíjak) frissítése
        id: fees
        if: ${{ !cancelled() }}
        env:
          FEES_SHEET_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vREZYKdFMHLNs-HwpuiewPYAqNNDHxl4CbptmVv-s5eyC_npPp7znaZv0Ivick1HO-hGNs9XosqDmAL/pub?output=xlsx
        run: python tools/sync_fees.py

      # the gallery is built after the programs (and their images) are updated
      - name: Galéria összeállítása
        id: gallery
        if: ${{ !cancelled() }}
        run: python tools/sync_gallery.py

      # Reminder e-mails to the program organisers and the media person (photos before, report after), sent
      # through the ADMIN_EMAIL / ADMIN_JELSZO secrets (an app password); without them only listed.
      # The sent ones are recorded in data/reminders.json, saved by the next step.
      - name: Emlékeztető levelek a szervezőknek és a médiásnak
        id: reminders
        if: ${{ !cancelled() }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_JELSZO: ${{ secrets.ADMIN_JELSZO }}
          WEBOLDAL_ADATOK_LINK: ${{ secrets.WEBOLDAL_ADATOK_LINK }}
        run: python tools/send_reminders.py

      # The public "802. Programok" Google Calendar follows the Programok sheet (people subscribe to it);
      # written through the service account the calendar is shared with
      - name: Google Naptár frissítése a programokból
        id: calendar
        if: ${{ !cancelled() }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          PROGRAM_CALENDAR_ID: 1d4d47e601ab2742f5b416c326ea0225611f94615da56c10c8e86c4911c9d752@group.calendar.google.com
          SITE_URL: https://www.802szentkorona.com/
        run: python tools/sync_calendar.py

      # On September 15 and October 15: an e-mail to 802@cserkesz.hu if the new (4th-grade) troop's
      # leaders are not on the Rajok sheet yet; recorded in data/troop_reminder.json.
      - name: Emlékeztető az új raj rajparancsnokainak elérhetőségéről
        id: troop_reminder
        if: ${{ !cancelled() }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_JELSZO: ${{ secrets.ADMIN_JELSZO }}
          WEBOLDAL_ADATOK_LINK: ${{ secrets.WEBOLDAL_ADATOK_LINK }}
        run: python tools/troop_reminder.py

      # From March 1 to August 1, monthly: an e-mail to the deputy responsible for camps if a camp card
      # misses its time, place, two main organisers or a contact; recorded in data/camp_reminder.json.
      - name: Emlékeztető a tábor kártyák hiányzó adatairól
        id: camp_reminder
        if: ${{ !cancelled() }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_JELSZO: ${{ secrets.ADMIN_JELSZO }}
          WEBOLDAL_ADATOK_LINK: ${{ secrets.WEBOLDAL_ADATOK_LINK }}
        run: python tools/camp_reminder.py

      # The footer's "report a problem" line on every page: the address of the ADMIN_EMAIL secret
      - name: Lábléc hibabejelentő címének frissítése
        id: footer
        if: ${{ !cancelled() }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: python tools/sync_footer.py

      # checks the generated pages (complete generated parts, no sheet error values, no broken links,
      # valid dates, no empty lists); only reports, changes nothing
      - name: Az oldalak ellenőrzése
        id: check
        if: ${{ !cancelled() }}
        run: python tools/check_site.py

      # e-mails the admin about the warnings and errors of this run (new ones at once, the same ones
      # daily, and once when all is fine again); data/sync_issues.json is saved by the next steps
      - name: Hibák jelentése e-mailben
        if: ${{ always() }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_JELSZO: ${{ secrets.ADMIN_JELSZO }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python tools/report_issues.py

      - name: Havi életjel
        if: ${{ !cancelled() }}
        run: date +%Y-%m > data/keepalive.txt

      - name: Változások mentése
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # images/webp as a whole: a named subfolder that no longer exists (e.g. every program image
          # removed) would make "git add" fail and lose every other change of the run
          git add -A -- '*.html' data images/webp
          if git diff --cached --quiet; then
            echo "Nincs változás."
            exit 0
          fi
          git commit -m "Oldal frissítése a táblázatból"
          # if someone pushed in the meantime, rebase onto it and try again (at most 3 times)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "A push nem sikerült ($attempt. próba), frissítem az ágat és újrapróbálom."
            git pull --rebase --quiet || { git rebase --abort; exit 1; }
          done
          exit 1
