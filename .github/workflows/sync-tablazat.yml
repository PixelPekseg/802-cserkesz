# A programok.html, tabor.html és csatlakozom.html kártyáit, valamint minden oldal tetején az
# értesítősávot, a főoldal/Rólunk számlálóit, az Eszközbérlés oldalt és a vezetők kártyáit (fotókkal) a csapat Google Táblázataiból (közzétett CSV-k) frissíti.
# Óránként fut, és kézzel is elindítható (Actions fül -> "Oldal frissítése a táblázatból" -> Run workflow).
# Ha a táblázat hibás vagy nem érhető el, a feladat hibával leáll, és az oldal az utolsó jó
# állapotot mutatja. A hónapban egyszer egy apró "életjel" módosítás is készül, mert a GitHub
# 60 nap tevékenység nélkül leállítja az ütemezett feladatokat.
name: Oldal frissítése a táblázatból

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tablazat
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # A közös "Csapat adatai" táblázat (Csapatvezetés, Rajok, Számlálók, Táborok lap), egészben,
      # Excel (.xlsx) formátumban közzétéve. Ha meg van adva, ez a négy lépés ebből olvas, és a
      # lépéseknél lévő régi, lapokénti *_CSV_URL címeket figyelmen kívül hagyja.
      CSAPAT_TABLAZAT_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vSNyNpdFavNXNehYPeRSQPIFVAoJvAnhYHvsccsap6jcOZuWMf_JlW2MbptfsoMhiPl4FPGKrzf5fjc/pub?output=xlsx
      # A közös "Vezetői táblázat" (Programok, Értesítők, Eszközök, Eszközök kapcsolattartója lap), minden vezető
      # szerkeszti; egészben, Excel (.xlsx) formátumban közzétéve. Ha meg van adva, a programok, az
      # értesítők és az eszközök lépése ebből olvas, és a régi, lapokénti *_CSV_URL címeket figyelmen kívül hagyja.
      VEZETOI_TABLAZAT_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRP5XgBM0ai_DzoDBPQTH5-OgK9hiTGr7opLP4V0sr58ONPOaMQw3xPKiUwGaCTiSBMBtApZIo893Vk/pub?output=xlsx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A Drive-ról jövő képek (személyfotók, programképek) feldolgozásához (WebP, iPhone-os HEIC)
      - name: Képkezelő csomagok telepítése
        run: pip install --quiet pillow pillow-heif openpyxl

      - name: Programok (kártyák + képek a Drive-ról) frissítése
        if: ${{ !cancelled() }}
        env:
          DRIVE_KEPEK_FOLDER_ID: 13jB-lTr4Eqt1WOImYwWhMahGHwDTLALA
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROGRAMOK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRxIhMKUiMXX41ujoCjIpmizaXDQwlRyBieMUQZSqZcFUF3ChIpqB1d5Q2Br608v88gWJOSxcu46zPV/pub?gid=659195366&single=true&output=csv
        run: python tools/sync_programok.py

      # A következő lépések akkor is lefutnak, ha egy előző hibázott (egy rossz táblázat
      # ne akadályozza a többit); a futás ilyenkor is hibásként jelenik meg a GitHubon.
      - name: Táborok letöltése és az oldal frissítése
        if: ${{ !cancelled() }}
        env:
          TABOROK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vSKJZCKF6eEgtepX6QnyK6d2cWgMlBenGM2il8-DDNytnpuUNoo1Eh37bdvaoroRgJrwyNfyTDIwzsy/pub?gid=1184983016&single=true&output=csv
        run: python tools/sync_taborok.py

      - name: Rajok letöltése és az oldal frissítése
        if: ${{ !cancelled() }}
        env:
          RAJOK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vSo3ta8YoCSTVLeuRsM1CHEXhe2TKCUrlYM4wG6UENCMWkkMgbqnwLe-bvMzxjyKxk9IsfZ40NA4__Z/pub?gid=1082322737&single=true&output=csv
        run: python tools/sync_rajok.py

      - name: Értesítők letöltése és az oldalak frissítése
        if: ${{ !cancelled() }}
        env:
          ERTESITOK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vSCFQEfDB5PGysGIga4CyQ7XH2KX09TWyreCDGbciXWjAP9a4PUgFuH6MbBRCjUZKOWaLA_BzbIuvXs/pub?gid=160520110&single=true&output=csv
        run: python tools/sync_ertesitok.py

      - name: Számlálók letöltése és az oldalak frissítése
        if: ${{ !cancelled() }}
        env:
          SZAMLALOK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQG9oKFwKR3SA_rogOVR9y6l_pefGSZKirDeMSxZU7_F-PdaYSleD8wkEQKg89VPK_ThCB2xQzJUWLA/pub?gid=1088990736&single=true&output=csv
        run: python tools/sync_szamlalok.py

      - name: Csapatvezetés (kártyák + fotók a Drive-ról) frissítése
        if: ${{ !cancelled() }}
        env:
          VEZETOK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTZ5xTnj9CNorqCmaTuwwpy-EPoRpyBcjJTMWM5QPH5G1lccxpX-z1DA0uwvh3emtt-OLgib1zOfLHf/pub?gid=1268841503&single=true&output=csv
          DRIVE_KEPEK_FOLDER_ID: 13jB-lTr4Eqt1WOImYwWhMahGHwDTLALA
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python tools/sync_vezetok.py

      - name: Eszközök letöltése és az oldal frissítése
        if: ${{ !cancelled() }}
        env:
          DRIVE_KEPEK_FOLDER_ID: 13jB-lTr4Eqt1WOImYwWhMahGHwDTLALA
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ESZKOZOK_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTawBNHKmmN8o2RHWIeLXtHikZ7oJTr19isdSULQXbp2sJte3a5TnaKpjeM_TA5UkxhjZ6OtOVCtMRD/pub?gid=263580124&single=true&output=csv
          ESZKOZ_KAPCSOLAT_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTawBNHKmmN8o2RHWIeLXtHikZ7oJTr19isdSULQXbp2sJte3a5TnaKpjeM_TA5UkxhjZ6OtOVCtMRD/pub?gid=1765500368&single=true&output=csv
        run: python tools/sync_eszkozok.py

      # Pénzügyek oldal: egy táblázat (lapok: Leírás, Tagdíj, Nagytábordíj, Kcs tábordíj), a TELJES
      # dokumentum Excel (.xlsx) formátumban közzétéve. Üres cím esetén az oldal változatlan marad.
      - name: Pénzügyek (tagdíj, tábordíjak) frissítése
        if: ${{ !cancelled() }}
        env:
          PENZUGY_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTmwEh1GFTMCfIMrSvbzqmpOvSVEzkmSHXjkG8UyG5B1xIrlfCnrqojRWDlFNdFPSyfdQYDSeInzSqX/pub?output=xlsx
        run: python tools/sync_penzugyek.py

      # a galéria a programok (és képeik) frissítése után áll össze
      - name: Galéria összeállítása
        if: ${{ !cancelled() }}
        run: python tools/sync_galeria.py

      - name: Havi életjel
        if: ${{ !cancelled() }}
        run: date +%Y-%m > data/keepalive.txt

      - name: Változások mentése
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html data/ images/webp/kozos/team/ images/webp/programok/
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Oldal frissítése a táblázatból"
            git push
          fi
